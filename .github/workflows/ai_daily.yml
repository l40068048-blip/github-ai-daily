name: 🤖 GitHub AI 日报

on:
  schedule:
    # 每天 UTC 1:00 = 北京时间 9:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🚀 运行 AI 日报 + 推送微信
        env:
          # 二选一：推荐 PushPlus（国内稳定）
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 备选：Server酱
          # SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python github_ai_daily.py --push

      - name: 📄 提交报告到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📅 AI 日报 - $(date +'%Y-%m-%d')"
          file_pattern: "github_ai_daily_*.md"
          commit_user_name: "AI Daily Bot"
          commit_user_email: "ai-daily-bot@users.noreply.github.com"
